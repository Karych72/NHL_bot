name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Syntax check (compileall)
        run: python -m compileall -q telegram_bot modeling pipeline

      - name: Tests without PostgreSQL
        run: python -m pytest tests/ -q --ignore=tests/test_db_nhl.py
