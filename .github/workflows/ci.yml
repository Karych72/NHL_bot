name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check telegram_bot modeling pipeline

      - name: Mypy
        run: python -m mypy telegram_bot modeling pipeline

      - name: Syntax check (compileall)
        run: python -m compileall -q telegram_bot modeling pipeline

      - name: Tests without PostgreSQL
        run: python -m pytest tests/ -q --ignore=tests/test_db_nhl.py
