# Релиз: мерж в master с изменениями кода прода (или ручной тег vX.Y.Z) → проверки CI →
# образ в GHCR → деплой на прод-VM (GCP) по SSH. При мерже job `tag` сам ставит следующий
# patch-тег (v1.2.0 → v1.2.1); ручной тег — для minor/major и хотфиксов.
# Откат — «Re-run jobs» у прогона предыдущего тега во вкладке Actions.
# Мерж в develop (Задача 80) — тот же путь без git-тега: образ dev-<sha> и деплой dev-стека
# в /opt/nhl_bot_dev на той же VM (dev-бот, база nhl_dev); прод он не трогает.
# Настройка VM и секретов окружения production — DEVELOPMENT.md §«Прод-деплой», «Dev-стенд».
name: Release

on:
  push:
    branches: [master, develop]
    tags: ["v*"]
    # Только то, что попадает в прод-образ и compose: мерж плана или документации
    # прод не передеплоивает. На пуш тега фильтр путей GitHub не применяет.
    paths:
      - "telegram_bot/**"
      - "pipeline/**"
      - "data_tables/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "deploy/**"
      - "Makefile"
      - "requirements.txt"
      # Сервис predict (Задача 73): образ modeling, модели — в deploy/models/.
      - "modeling/**"
      - "requirements-modeling.txt"

# Два деплоя одновременно не идут: идущий не прерывается, но ждать может только один
# прогон — новый вытесняет (отменяет) ожидающий. Серия быстрых мержей выкатит последний.
# Свои группы у прода и dev: деплой develop не вытесняет ожидающий деплой прода.
concurrency:
  group: deploy-${{ github.ref_name == 'develop' && 'dev' || 'production' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/karych72/nhl_bot

# По умолчанию токен только на чтение; запись — у job `tag` (тег) и `image` (GHCR).
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Тег релиза: при пуше тега — он сам; при мерже в master — следующий patch от
  # последнего v*-тега, поставленный на этот коммит. Тег, запушенный GITHUB_TOKEN,
  # новый прогон этого workflow не запускает — деплой идёт в этом же прогоне.
  # На develop git-тег не ставится: версия образа — dev-<короткий sha>.
  tag:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      name: ${{ steps.tag.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" = "develop" ]; then
            echo "name=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            echo "name=$REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Перезапуск прогона (откат «Re-run») выкатывает уже поставленный тег, а не новый.
          existing=$(git tag --points-at "$GITHUB_SHA" --list 'v*' --sort=-v:refname | head -1)
          if [ -n "$existing" ]; then
            echo "name=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          [ -n "$last" ] || { echo "Нет тега вида vX.Y.Z — первый релиз ставится вручную" >&2; exit 1; }
          IFS=. read -r major minor patch <<< "${last#v}"
          next="v${major}.${minor}.$((patch + 1))"
          git tag "$next" "$GITHUB_SHA"
          git push origin "$next"
          echo "name=$next" >> "$GITHUB_OUTPUT"

  image:
    needs: tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.tag.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Образ сервиса predict (Задача 73): стадия modeling, тот же пакет GHCR с суффиксом тега.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: modeling
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.tag.outputs.name }}-modeling
          # Свой scope: иначе кэш образа бота и modeling перетирали бы друг друга.
          cache-from: type=gha,scope=modeling
          cache-to: type=gha,mode=max,scope=modeling

  deploy:
    needs: [tag, image]
    runs-on: ubuntu-24.04
    # Одно окружение на оба стека: та же VM и тот же SSH-пользователь, секреты DEPLOY_* общие.
    environment: production
    env:
      DIR: ${{ github.ref_name == 'develop' && '/opt/nhl_bot_dev' || '/opt/nhl_bot' }}
      # Прод — на тег, dev — на коммит develop (тега у него нет).
      REF: ${{ github.ref_name == 'develop' && github.sha || needs.tag.outputs.name }}
    steps:
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # На VM: код и docker-compose.yml — из того же коммита, что и образ; migrate
      # применяет функции и миграции до старта bot/sync; --wait роняет деплой,
      # если bot не стал healthy. Какой стек — решает .env каталога: в /opt/nhl_bot_dev
      # COMPOSE_PROJECT_NAME и COMPOSE_FILE с deploy/compose.dev.yml (без db и backup).
      - name: Deploy
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<'REMOTE'
          set -euo pipefail
          cd "${{ env.DIR }}"
          git fetch --tags --force origin
          git checkout --force "${{ env.REF }}"
          # В .env, а не export: ручной `docker compose ...` на VM видит ту же версию.
          sed -i '/^NHL_BOT_IMAGE=/d;/^NHL_BOT_MODELING_IMAGE=/d' .env
          echo "NHL_BOT_IMAGE=${{ env.IMAGE }}:${{ needs.tag.outputs.name }}" >> .env
          echo "NHL_BOT_MODELING_IMAGE=${{ env.IMAGE }}:${{ needs.tag.outputs.name }}-modeling" >> .env
          docker compose pull migrate bot sync predict
          docker compose up -d --no-build --remove-orphans
          docker compose up --no-build --wait --wait-timeout 180 bot
          docker compose ps
          docker image prune -af
          REMOTE
