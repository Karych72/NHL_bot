# Local stack: PostgreSQL + bot. Copy .env.example → .env and set TELEGRAM_BOT_TOKEN.
# Apply schema/functions on first run: make db-init with PG_* pointed at localhost:5432,
# or run the Makefile DDL targets against host port 5432 after `docker compose up -d db`.
# `name:` pins the compose project (and therefore the pgdata volume name) so it does not
# depend on the directory the command is run from (e.g. a task worktree vs. the main checkout).
name: nhl_bot

services:
  db:
    image: postgres:16.6-alpine
    # Переживает перезагрузку хоста и падение процесса (Задача 35); данные не теряются —
    # они на named volume pgdata, а не в самом контейнере.
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      # trust avoids a password in compose for the default superuser; safe here only
      # because the port below is published on loopback, not 0.0.0.0 (see docs).
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 6

  # Применяет SQL-функции и миграции перед стартом bot и sync, при каждом `up`. Цели
  # идемпотентны: функции — CREATE OR REPLACE, миграции пропускают уже применённые
  # (schema_migrations). Таблицы не создаёт — на пустой БД сначала `make db-sync`
  # (DEVELOPMENT.md §Docker, «Развёртывание с нуля»).
  migrate:
    image: ${NHL_BOT_IMAGE:-nhl-bot:local}
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_HOST: db
      PG_PORT: "5432"
      PG_USER: postgres
      PG_DATABASE: postgres
    working_dir: /app
    command: ["make", "db-functions", "db-migrate"]

  bot:
    # NHL_BOT_IMAGE задаёт прод-деплой (release.yml) — образ из GHCR вместо локальной сборки.
    image: ${NHL_BOT_IMAGE:-nhl-bot:local}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      PG_HOST: db
      PG_PORT: "5432"
      PG_USER: postgres
      PG_DATABASE: postgres
    working_dir: /app/telegram_bot
    command: ["python", "bot.py"]

  sync:
    image: ${NHL_BOT_IMAGE:-nhl-bot:local}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      PG_HOST: db
      PG_PORT: "5432"
      PG_USER: postgres
      PG_DATABASE: postgres
    working_dir: /app/pipeline
    command: ["python", "-u", "scheduled_sync.py", "loop"]
    volumes:
      - syncdata:/app/all_data
    # Overrides the bot's PG-connect HEALTHCHECK (Dockerfile): this container's
    # actual job is the nightly sync, so "healthy" means "last sync run ok and
    # not stale" (scheduled_sync.py check), not "can reach PostgreSQL".
    # start_period covers the catch-up run scheduled_sync.py does at startup.
    healthcheck:
      test: ["CMD", "python", "scheduled_sync.py", "check"]
      interval: 5m
      timeout: 30s
      start_period: 30m
      retries: 3

  retrain:
    # Еженедельный retrain (Задача 26): тот же механизм, что у sync (pipeline/scheduled_retrain.py
    # переиспользует scheduled_sync), но образ со стадией modeling (lightgbm/sklearn — в образ
    # бота не попадают). Понедельник 12:00 UTC, вне ночного окна sync (18:00–08:00 UTC); стартует только
    # после успешного sync. Обучает home_win с --no-promote: latest двигает человек
    # (make modeling-promote). Артефакты — bind mount ./artifacts, статус — в томе syncdata.
    # profiles: трек B в релиз не входит (решение человека, plan/open_tasks.md), поэтому обычные
    # `docker compose up -d`/`build` сервис не собирают и не запускают:
    # `docker compose --profile modeling up -d retrain`.
    # Отключён до Задачи 67 (решение человека, 2026-10-10): home_win проигрывает Elo-эталону
    # Задачи 66, каждый прогон был бы красным — профиль не поднимать (docs/modeling_training.md §9).
    profiles: ["modeling"]
    build:
      context: .
      target: modeling
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PG_HOST: db
      PG_PORT: "5432"
      PG_USER: postgres
      PG_DATABASE: postgres
    working_dir: /app
    command: ["python", "-u", "pipeline/scheduled_retrain.py", "loop"]
    volumes:
      - syncdata:/app/all_data
      - ./artifacts:/app/artifacts
    # Здоров = последний retrain ok и не старше 8 дней (scheduled_retrain.py check).
    # start_period покрывает догоняющий прогон при старте (замер: ~45 с на 6560 играх;
    # запас с учётом более медленного CPU контейнера).
    healthcheck:
      test: ["CMD", "python", "pipeline/scheduled_retrain.py", "check"]
      interval: 1h
      timeout: 30s
      start_period: 10m
      retries: 3

  backup:
    # Compose-сервис вместо host cron (Задача 35, решение контроллера п.1) — тот же
    # долгоживущий-контейнер-со-своим-циклом, что и sync. Образ — тот же postgres:16.6-alpine,
    # что у db: версия pg_dump совпадает с версией сервера без обращения к хостовым утилитам.
    image: postgres:16.6-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # BACKUP_DIR обязателен (см. .env.example) — bind mount вне тома pgdata и вне репозитория,
    # compose падает с понятным сообщением, если переменная не задана.
    volumes:
      - ${BACKUP_DIR:?задайте BACKUP_DIR в .env — абсолютный путь на хосте вне репозитория и тома pgdata}:/backups
    # Раз в сутки (86400с) снимает pg_dump в кастомном формате, первый дамп — сразу при
    # старте. Пишет во временный файл и переименовывает после успешного завершения, чтобы
    # оборванный дамп не выглядел свежим для восстановления или healthcheck. set -e: если
    # pg_dump падает, падает и цикл (Global Constraint 4) — restart: unless-stopped поднимет
    # контейнер заново, а падение видно в `docker compose ps` / логах. Ротация — 14 последних
    # дампов (имена nhl_<UTC-метка>.dump сортируются как строки в хронологическом порядке).
    command:
      - sh
      - -c
      - |
        set -e
        while true; do
          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          tmp="/backups/.nhl_$${ts}.dump.tmp"
          out="/backups/nhl_$${ts}.dump"
          pg_dump -h db -U postgres -Fc postgres > "$$tmp"
          mv "$$tmp" "$$out"
          ls -1 /backups/nhl_*.dump 2>/dev/null | sort -r | tail -n +15 | xargs -r rm -f
          sleep 86400
        done
    # Здоров, если в каталоге есть дамп моложе 26 часов (как STALE_AFTER у sync).
    healthcheck:
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -name 'nhl_*.dump' -mmin -1560 | grep -q ."]
      interval: 30m
      timeout: 10s
      start_period: 5m
      retries: 3

volumes:
  pgdata:
  syncdata:
