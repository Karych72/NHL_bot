random_seed: 42

compute:
  num_threads: 4
  log_level: INFO

tasks:
  home_win:
    enabled: true
  over_5_5:
    enabled: true

# Smoke profile: geometry sized for a single-season (or smaller) dataset,
# order of magnitude ~1200 rows and below (before Задача 30, the only local
# dataset was `season_20252026/`, 1211 games). Not for production training --
# use configs/modeling_default.yaml once multiseason history is available.
#
# Guard (modeling/splits.py, Задача 14) requires
# wf_rows >= inner_val_games + calibration_games + n_test_windows*1 + 1
#         = 50 + 50 + 3 + 1 = 104
# and total rows >= holdout + 104, i.e. N >= ceil(104 / (1 - holdout.fraction))
#         = ceil(104 / 0.85) = 123 rows minimum (guard's necessary lower bound
# on raw row counts only -- see configs/modeling_default.yaml for the same
# caveat: real calendar-month feasibility is checked separately, later, by
# _window_from_tail). A real single season (~1211 rows, ~7 calendar months)
# leaves ~4 months (~700 rows) before the earliest of the 3 test months,
# comfortably above the 101 rows (inner_val 50 + calibration 50 + train>=1)
# that window needs.
split:
  method: month
  n_test_windows: 3
  inner_val_games: 50
  calibration_games: 50
  holdout:
    fraction: 0.15
    date_range:
      from: null
      to: null

# Smoke grids: one arbitrary value per axis, unrelated in size or value to
# configs/modeling_default.yaml's production grid -- only to exercise the
# pipeline end to end. models.lgbm.monotone is kept as in production.
models:
  logreg:
    grids:
      C: [1.0]
  lgbm:
    grids:
      num_leaves: [31]
      min_data_in_leaf: [50]
      feature_fraction: [0.9]
      bagging_fraction: [0.9]
      lambda_l1: [0.1]
      lambda_l2: [0.1]
      learning_rate: [0.05]
    # Real dataset diff_/sum_ columns, same fix and sign reasoning as
    # configs/modeling_default.yaml; see docs/modeling_training.md §7 (Задача 39).
    monotone:
      home_win:
        diff_goals_for_roll_mean_5: 1
        diff_goals_for_roll_mean_10: 1
        diff_goals_for_roll_mean_20: 1
        diff_goals_against_roll_mean_5: -1
        diff_goals_against_roll_mean_10: -1
        diff_goals_against_roll_mean_20: -1
        diff_goal_diff_roll_mean_5: 1
        # Задача 40 (Task 3): pre-game Elo diff, home - away; see
        # configs/modeling_default.yaml and docs/modeling_dataset_builder.md
        # "Elo team-strength feature".
        diff_elo: 1
      over_5_5:
        sum_goals_for_roll_mean_5: 1
        sum_goals_for_roll_mean_10: 1
        sum_goals_for_roll_mean_20: 1
        sum_goals_against_roll_mean_5: 1
        sum_goals_against_roll_mean_10: 1
        sum_goals_against_roll_mean_20: 1

calibration:
  # Isotonic on a 300-game calibration block outputs exact 0/1 at the extreme
  # bins, which blows up holdout log-loss (spike 40a). Platt is the default.
  method: platt
  # Must not exceed split.calibration_games (50), or calibration is skipped.
  min_samples: 50

evaluation:
  ece_bins: 10
  bootstrap_samples: 1000
  bootstrap_block_by_day: true
  epsilon_clip: 1.0e-15
