random_seed: 42

compute:
  num_threads: 4
  log_level: INFO

tasks:
  home_win:
    enabled: true
  over_5_5:
    enabled: true

# Working multiseason profile. Guard (modeling/splits.py, Задача 14) requires
# wf_rows >= inner_val_games + calibration_games + n_test_windows*1 + 1
#         = 300 + 300 + 5 + 1 = 606
# and total rows >= holdout + 606, i.e. N >= ceil(606 / (1 - holdout.fraction))
#         = ceil(606 / 0.85) = 713 rows minimum (guard's necessary lower bound
# on raw row counts only -- NOT sufficient: the earliest of the n_test_windows
# selected calendar months also needs a real inner_val+calibration pool
# strictly before it, which depends on how games are distributed across
# months, not just the total row count; that is checked separately, later,
# by _window_from_tail). Checked against the actual dataset (Задача 30,
# 2026-09-12): 6049 rows / 5 seasons, comfortably above both bounds -- fits.
# For a single-season/smoke-sized dataset use configs/modeling_smoke.yaml.
split:
  method: month
  n_test_windows: 5
  inner_val_games: 300
  calibration_games: 300
  holdout:
    fraction: 0.15
    date_range:
      from: null
      to: null

models:
  logreg:
    grids:
      C: [0.01, 0.1, 1.0, 10.0]
  lgbm:
    grids:
      num_leaves: [15, 31, 63]
      min_data_in_leaf: [20, 50, 100]
      feature_fraction: [0.7, 0.9, 1.0]
      bagging_fraction: [0.7, 0.9, 1.0]
      lambda_l1: [0.0, 0.1, 1.0]
      lambda_l2: [0.0, 0.1, 1.0]
      learning_rate: [0.03, 0.05, 0.1]
    # Задача 39: names below are real dataset columns (checked against
    # modeling/dataset_builder/features.py + assemble.py's diff_/sum_ wide
    # columns, not aliases) -- the old diff_gf_*/diff_ga_*/sum_gf_*/sum_ga_*
    # and the diff_goal_diff_roll_mean_{10,20} keys don't exist in the
    # dataset (goal_diff/pace_sum are derived only on window 5) and made
    # build_monotone_constraints raise ConfigError, so lgbm never trained.
    # Signs are unchanged domain reasoning, only names are fixed:
    # home scoring more (diff_goals_for) or conceding less (diff_goals_against,
    # hence the -1) than away raises P(home_win); a positive combined recent
    # goal differential (diff_goal_diff_roll_mean_5) does too. For over_5_5,
    # more goals for OR against on either side both push the total over the
    # 5.5 line, hence +1 for both sum_goals_for_* and sum_goals_against_*.
    monotone:
      home_win:
        diff_goals_for_roll_mean_5: 1
        diff_goals_for_roll_mean_10: 1
        diff_goals_for_roll_mean_20: 1
        diff_goals_against_roll_mean_5: -1
        diff_goals_against_roll_mean_10: -1
        diff_goals_against_roll_mean_20: -1
        diff_goal_diff_roll_mean_5: 1
      over_5_5:
        sum_goals_for_roll_mean_5: 1
        sum_goals_for_roll_mean_10: 1
        sum_goals_for_roll_mean_20: 1
        sum_goals_against_roll_mean_5: 1
        sum_goals_against_roll_mean_10: 1
        sum_goals_against_roll_mean_20: 1

calibration:
  method: isotonic
  # Задача 39: must not exceed split.calibration_games (300) -- above it
  # every calibration block is smaller than the threshold and
  # fit_calibrator (modeling/calibrate.py:196) silently skips calibration on
  # every fold, storing an identity calibrator (real run before the fix:
  # artifacts/models/home_win/logreg/latest/metadata.json had
  # calibration_skipped: true, n_calibration: 300). See docs/modeling_training.md §7.
  min_samples: 300

evaluation:
  ece_bins: 10
  bootstrap_samples: 1000
  bootstrap_block_by_day: true
  epsilon_clip: 1.0e-15
