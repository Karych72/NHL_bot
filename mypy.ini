[mypy]
python_version = 3.11
show_error_codes = True
disable_error_code = annotation-unchecked

# Точечные послабления вместо глобального ignore_missing_imports (Задача 25,
# отметка в plan/engineering/work_plan_2026-08-08.md). Список получен прогоном
# mypy без глобального игнора, не догадкой.

[mypy-joblib.*]
ignore_missing_imports = True
# joblib не поставляет py.typed и не имеет официальных стабов на PyPI (types-joblib
# не существует).

[mypy-sklearn.*]
ignore_missing_imports = True
# scikit-learn не поставляет py.typed. Единственный стаб-пакет на PyPI
# ("scikit-learn-stubs", v0.0.3, неофициальный форк Microsoft python-type-stubs) —
# сторонний, не поддерживается upstream; добавлять его как новую зависимость без
# явного разрешения человека нельзя (Global Constraint 5), поэтому — игнор.
